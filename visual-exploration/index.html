<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071a14">
  <title>麻雀ホールデム — ビジュアルを選ぶ</title>
  <style>
    :root{--bg:#071a14;--ivory:#f8f1df;--gold:#dfbd62;--line:rgba(248,241,223,.16)}
    *{box-sizing:border-box}html{background:var(--bg);color:var(--ivory);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,#275a47 0,#0a271e 38%,#061611 100%)}
    button,select,textarea{font:inherit}button{cursor:pointer}.shell{width:min(100%,760px);margin:auto;padding:env(safe-area-inset-top) 12px calc(34px + env(safe-area-inset-bottom))}
    header{padding:22px 4px 14px}.eyebrow{color:#dcc77f;font-size:11px;font-weight:800;letter-spacing:.12em}.title{font-size:clamp(28px,8vw,46px);line-height:1.15;margin:8px 0}.lead{margin:0;color:#c4d0cb;font-size:14px;line-height:1.7}.lead b{color:#ffe49b}
    .status{position:sticky;top:0;z-index:20;padding:10px 0;background:linear-gradient(var(--bg) 72%,transparent)}.statusbox{border:1px solid var(--line);background:rgba(9,31,24,.94);backdrop-filter:blur(14px);border-radius:14px;padding:11px;box-shadow:0 12px 28px rgba(0,0,0,.28)}
    .progressline{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}.progressline b{color:#ffe49b;font-size:15px}.track{height:6px;border-radius:999px;background:#193c31;margin:9px 0 10px;overflow:hidden}.track span{display:block;height:100%;width:0;background:linear-gradient(90deg,#c59a34,#f2d984);transition:width .2s}
    .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters select{min-height:42px;width:100%;border:1px solid var(--line);border-radius:10px;background:#12382c;color:#fff;padding:0 10px}
    .review{border:1px solid var(--line);border-radius:19px;overflow:hidden;background:linear-gradient(180deg,#14392d,#09231a);box-shadow:0 20px 44px rgba(0,0,0,.3)}.imagearea{position:relative;background:#020a08;touch-action:pan-y}.imagearea img{display:block;width:100%;max-height:min(66vh,820px);aspect-ratio:941/1672;object-fit:contain}.badge{position:absolute;left:11px;top:11px;padding:7px 10px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(4,18,13,.82);font-size:11px;font-weight:800}.position{position:absolute;right:11px;top:11px;padding:7px 10px;border-radius:999px;background:rgba(4,18,13,.82);font-weight:800;font-size:12px}.zoom{position:absolute;right:11px;bottom:11px;border:1px solid rgba(255,255,255,.34);border-radius:10px;background:rgba(4,18,13,.84);color:#fff;padding:9px 12px;font-weight:800;font-size:12px}
    .details{padding:15px}.details h2{font-size:19px;line-height:1.4;margin:0}.history{font-size:12px;color:#d8c57f;margin:5px 0 0}.question{font-size:17px;font-weight:900;margin:18px 0 10px}.choices{display:grid;gap:8px}.choice{display:grid;grid-template-columns:28px 1fr;align-items:center;text-align:left;gap:10px;min-height:58px;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:#0a281f;color:#fff}.choice .mark{display:grid;place-items:center;width:26px;height:26px;border:1px solid rgba(255,255,255,.24);border-radius:50%;font-weight:900}.choice b{display:block;font-size:14px}.choice small{display:block;color:#9fb5ab;margin-top:2px}.choice.on[data-v="KEEP"]{background:#d8b652;color:#1e1706;border-color:#ffe69b}.choice.on[data-v="KEEP"] small,.choice.on[data-v="KEEP"] .mark{color:#392b08}.choice.on[data-v="MIX"]{background:#267a8e;border-color:#78c5d6}.choice.on[data-v="DROP"]{background:#903f39;border-color:#e28c83}
    .note-label{display:block;margin-top:14px;color:#c8d4cf;font-size:12px;font-weight:800}.note{width:100%;min-height:72px;margin-top:7px;resize:vertical;border-radius:10px;border:1px solid var(--line);background:#071e17;color:#fff;padding:10px;line-height:1.55}.note::placeholder{color:#759086}
    .nav{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:8px;padding:13px 15px 16px}.nav button{min-height:48px;border:1px solid var(--line);border-radius:11px;background:#12382c;color:#fff;font-weight:900}.nav .next{background:linear-gradient(#ead17f,#c39731);color:#241b06;border-color:#f5dfa1}.nav button:disabled{opacity:.34;cursor:default}.hint{text-align:center;color:#8fa79d;font-size:11px;margin:10px 0 18px}
    .empty{padding:50px 20px;text-align:center;color:#c6d2cd}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.actions button{min-height:46px;border-radius:11px;border:1px solid var(--line);background:#10362a;color:#fff;font-weight:800}.actions .primary{background:#d3b253;color:#211805}
    dialog{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#030a08;color:#fff}dialog::backdrop{background:#000}.viewerbar{position:fixed;inset:0 0 auto;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(rgba(0,0,0,.88),transparent)}.viewerbar b{font-size:13px;text-shadow:0 2px 5px #000}.viewerbar button{border:1px solid rgba(255,255,255,.35);border-radius:10px;background:rgba(0,0,0,.6);color:#fff;padding:9px 13px;font-weight:800}.viewerbody{height:100%;display:grid;place-items:center;touch-action:pan-y}.viewerbody img{display:block;width:100%;height:100%;object-fit:contain}.viewernav{position:fixed;inset:auto 0 0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.88))}.viewernav button{min-height:48px;border:1px solid rgba(255,255,255,.3);border-radius:11px;background:rgba(15,47,37,.88);color:#fff;font-weight:900}
    .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));translate:-50% 18px;z-index:50;opacity:0;pointer-events:none;white-space:nowrap;border-radius:999px;background:#f1d47f;color:#1e1706;padding:11px 16px;font-size:12px;font-weight:900;transition:.2s}.toast.on{opacity:1;translate:-50% 0}
    @media(min-width:680px){.shell{padding-left:18px;padding-right:18px}.choices{grid-template-columns:repeat(3,1fr)}.choice{grid-template-columns:1fr;text-align:center;place-items:center}.choice .mark{margin:auto}.details{padding:18px 20px}.nav{padding:15px 20px 20px}}
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="eyebrow">麻雀ホールデム｜ビジュアル選定</div>
    <h1 class="title">1枚ずつ見て、<br>直感で選ぶ。</h1>
    <p class="lead">難しい評価は不要です。画像を大きく見て、<b>いちばん近い答えを1つ</b>選んでください。</p>
  </header>
  <div class="status"><div class="statusbox">
    <div class="progressline"><span>回答済み <b id="answered">0 / 26</b></span><span id="currentPosition">1 / 26</span></div>
    <div class="track"><span id="progress"></span></div>
    <div class="filters">
      <select id="setFilter" aria-label="表示する画像群"><option value="all">すべての案</option><option value="clean">現在の基準 3案</option><option value="meta">新しいガチャ案 5案</option><option value="v2">以前の案 18案</option></select>
      <select id="verdictFilter" aria-label="回答で絞り込む"><option value="all">すべての回答</option><option value="unset">まだ答えていない</option><option value="KEEP">進めたい</option><option value="MIX">部分だけ使いたい</option><option value="DROP">今回は使わない</option></select>
    </div>
  </div></div>
  <main id="review"></main>
  <p class="hint">画像部分を左右にスワイプしても移動できます</p>
  <div class="actions"><button class="primary" id="copyBtn">回答をコピー</button><button id="jsonBtn">回答をファイル保存</button></div>
</div>
<dialog id="viewer">
  <div class="viewerbar"><b id="viewerTitle"></b><button id="closeViewer">閉じる</button></div>
  <div class="viewerbody" id="viewerBody"><img id="viewerImg" alt=""></div>
  <div class="viewernav"><button id="viewerPrev">← 前の案</button><button id="viewerNext">次の案 →</button></div>
</dialog>
<div class="toast" id="toast">保存しました</div>
<script>
const clean=[
  {id:'clean-match',set:'clean',title:'対局画面',file:'../art/clean-masters/clean-master-match.webp',old:'現在の比較基準'},
  {id:'clean-lobby',set:'clean',title:'ロビー画面',file:'../art/clean-masters/clean-master-lobby.webp',old:'現在の比較基準'},
  {id:'clean-gacha',set:'clean',title:'ガチャ画面',file:'../art/clean-masters/clean-master-gacha.webp',old:'現在の比較基準'}
];
const meta=[
  {id:'meta-a',set:'meta',title:'A｜現代日本プレミアムクラブ',file:'../art/meta-gacha-lab/meta-a-japanese-premium-club-941x1672.png',old:'新しい比較候補（未決定）'},
  {id:'meta-b',set:'meta',title:'B｜日本発フューチャーリーグ',file:'../art/meta-gacha-lab/meta-b-future-league-941x1672.png',old:'新しい比較候補（未決定）'},
  {id:'meta-c',set:'meta',title:'C｜キャラクター対決',file:'../art/meta-gacha-lab/meta-c-character-showdown-941x1672.png',old:'新しい比較候補（未決定）'},
  {id:'meta-d',set:'meta',title:'D｜現代日本工芸',file:'../art/meta-gacha-lab/meta-d-modern-japanese-craft-941x1672.png',old:'新しい比較候補（未決定）'},
  {id:'meta-e',set:'meta',title:'E｜日本グラフィックポップ',file:'../art/meta-gacha-lab/meta-e-graphic-pop-941x1672.png',old:'新しい比較候補（未決定）'}
];
const names=['タイトル・開始画面','キャラクターロビー','モード選択','キャラクター一覧','キャラクター詳細','ガチャ告知','ガチャ結果','着せ替え','ショップ・シーズンパス','ランク進行','ミッション・イベント','大会表','賭ける場面','4枚公開','テンパイ注目','オールインの緊張','決着・ツモ','対局結果'];
const files=['01-title-opening','02-character-lobby','03-mode-select','04-character-roster','05-character-detail','06-gacha-banner','07-gacha-result','08-customization','09-shop-season-pass','10-rank-progression','11-missions-event','12-tournament-bracket','13-betting-decision','14-four-tile-reveal','15-tenpai-focus','16-all-in-pressure','17-river-tsumo','18-match-result'];
const previousKeeps=new Set([1,5,7,8,10,11,13,14,15,16,17,18]);
const items=[...clean,...meta,...files.map((file,index)=>({id:`v2-${String(index+1).padStart(2,'0')}`,set:'v2',title:names[index],file:`../art/visual-archive/v2/${file}.webp`,old:previousKeeps.has(index+1)?'以前の選定では候補に残った案':'以前の選定では見送った案'}))];
const setLabels={clean:'現在の基準',meta:'新しいガチャ案',v2:'以前の案'};
const labels={KEEP:'この方向で進めたい',MIX:'良い部分だけ使いたい',DROP:'今回は使わない'};
const storageKey='mahjong-holdem-visual-review-v3';
let state=JSON.parse(localStorage.getItem(storageKey)||'{}');
let currentIndex=0;
let touchStartX=0;
const review=document.querySelector('#review');
const viewer=document.querySelector('#viewer');
function filteredItems(){
  const setValue=document.querySelector('#setFilter').value;
  const verdictValue=document.querySelector('#verdictFilter').value;
  return items.filter(item=>(setValue==='all'||item.set===setValue)&&(verdictValue==='all'||(verdictValue==='unset'&&!state[item.id]?.verdict)||state[item.id]?.verdict===verdictValue));
}
function save(){localStorage.setItem(storageKey,JSON.stringify(state));updateProgress()}
function updateProgress(){const answered=items.filter(item=>state[item.id]?.verdict).length;document.querySelector('#answered').textContent=`${answered} / ${items.length}`;document.querySelector('#progress').style.width=`${answered/items.length*100}%`}
function move(delta){const visible=filteredItems();if(!visible.length)return;currentIndex=Math.max(0,Math.min(visible.length-1,currentIndex+delta));render()}
function choose(id,verdict){state[id]={...state[id],verdict};save();render()}
function render(){
  const visible=filteredItems();
  if(currentIndex>=visible.length)currentIndex=Math.max(0,visible.length-1);
  if(!visible.length){review.innerHTML='<section class="review empty"><b>この条件に合う画像はありません。</b><p>上の絞り込みを変更してください。</p></section>';document.querySelector('#currentPosition').textContent='0 / 0';updateProgress();return}
  const item=visible[currentIndex];const selected=state[item.id]?.verdict;
  document.querySelector('#currentPosition').textContent=`${currentIndex+1} / ${visible.length}`;
  review.innerHTML=`<article class="review">
    <div class="imagearea" id="swipeArea"><img src="${item.file}" alt="${item.title}"><span class="badge">${setLabels[item.set]}</span><span class="position">${currentIndex+1} / ${visible.length}</span><button class="zoom" id="zoomBtn">全画面で見る</button></div>
    <div class="details"><h2>${item.title}</h2><p class="history">${item.old}</p><p class="question">この案をどうしたいですか？</p>
      <div class="choices">
        <button class="choice ${selected==='KEEP'?'on':''}" data-v="KEEP"><span class="mark">○</span><span><b>この方向で進めたい</b><small>ほぼこの方向を基準にする</small></span></button>
        <button class="choice ${selected==='MIX'?'on':''}" data-v="MIX"><span class="mark">＋</span><span><b>良い部分だけ使いたい</b><small>構図・色・キャラなどを採用</small></span></button>
        <button class="choice ${selected==='DROP'?'on':''}" data-v="DROP"><span class="mark">×</span><span><b>今回は使わない</b><small>次の比較から外す</small></span></button>
      </div>
      <label class="note-label">伝えたいことがあれば（任意）<textarea class="note" id="note" placeholder="例：キャラの大きさは好き。背景はもっと静かに。">${state[item.id]?.note||''}</textarea></label>
    </div>
    <nav class="nav"><button id="prevBtn" ${currentIndex===0?'disabled':''}>← 前へ</button><button id="nextUnanswered">未回答へ</button><button class="next" id="nextBtn" ${currentIndex===visible.length-1?'disabled':''}>次へ →</button></nav>
  </article>`;
  document.querySelectorAll('.choice').forEach(button=>button.onclick=()=>choose(item.id,button.dataset.v));
  document.querySelector('#note').onchange=event=>{state[item.id]={...state[item.id],note:event.target.value};save();toast('メモを保存しました')};
  document.querySelector('#prevBtn').onclick=()=>move(-1);document.querySelector('#nextBtn').onclick=()=>move(1);
  document.querySelector('#nextUnanswered').onclick=()=>{const next=visible.findIndex((candidate,index)=>index>currentIndex&&!state[candidate.id]?.verdict);const first=visible.findIndex(candidate=>!state[candidate.id]?.verdict);currentIndex=next>=0?next:first>=0?first:currentIndex;render()};
  document.querySelector('#zoomBtn').onclick=()=>openViewer(item);bindSwipe(document.querySelector('#swipeArea'));updateProgress();
}
function bindSwipe(element){element.ontouchstart=event=>{touchStartX=event.changedTouches[0].screenX};element.ontouchend=event=>{const distance=event.changedTouches[0].screenX-touchStartX;if(Math.abs(distance)<55)return;move(distance<0?1:-1);if(viewer.open)syncViewer()}}
function openViewer(item){document.querySelector('#viewerImg').src=item.file;document.querySelector('#viewerImg').alt=item.title;document.querySelector('#viewerTitle').textContent=`${currentIndex+1} / ${filteredItems().length}　${item.title}`;viewer.showModal()}
function syncViewer(){const visible=filteredItems();if(!visible.length)return;const item=visible[currentIndex];document.querySelector('#viewerImg').src=item.file;document.querySelector('#viewerImg').alt=item.title;document.querySelector('#viewerTitle').textContent=`${currentIndex+1} / ${visible.length}　${item.title}`}
function exportText(){const lines=['麻雀ホールデム　ビジュアル選定結果',''];['KEEP','MIX','DROP'].forEach(verdict=>{lines.push(labels[verdict]);items.filter(item=>state[item.id]?.verdict===verdict).forEach(item=>lines.push(`・${item.title}${state[item.id]?.note?`：${state[item.id].note}`:''}`));lines.push('')});lines.push(`未回答：${items.filter(item=>!state[item.id]?.verdict).length}件`);return lines.join('\n')}
function exportJson(){const payload={schemaVersion:2,exportedAt:new Date().toISOString(),reviewKey:storageKey,items:items.map(item=>({...item,verdict:state[item.id]?.verdict||null,verdictLabel:labels[state[item.id]?.verdict]||null,note:state[item.id]?.note||''}))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=url;anchor.download='mahjong-holdem-visual-review.json';anchor.click();URL.revokeObjectURL(url)}
function toast(message){const element=document.querySelector('#toast');element.textContent=message;element.classList.add('on');setTimeout(()=>element.classList.remove('on'),1500)}
document.querySelector('#setFilter').onchange=()=>{currentIndex=0;render()};document.querySelector('#verdictFilter').onchange=()=>{currentIndex=0;render()};
document.querySelector('#copyBtn').onclick=async()=>{await navigator.clipboard.writeText(exportText());toast('回答をコピーしました')};document.querySelector('#jsonBtn').onclick=()=>{exportJson();toast('回答を保存しました')};
document.querySelector('#closeViewer').onclick=()=>viewer.close();document.querySelector('#viewerPrev').onclick=()=>{move(-1);syncViewer()};document.querySelector('#viewerNext').onclick=()=>{move(1);syncViewer()};bindSwipe(document.querySelector('#viewerBody'));
document.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'){move(-1);if(viewer.open)syncViewer()}if(event.key==='ArrowRight'){move(1);if(viewer.open)syncViewer()}});render();
</script>
</body>
</html>
