<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c0d10">
  <title>麻雀ホールデム｜画風比較</title>
  <style>
    :root{color-scheme:dark;--bg:#0c0d10;--panel:#15171c;--line:#30343d;--text:#f7f4ed;--sub:#aaaeb8;--accent:#ff6247;--good:#84e6c0;--mix:#ffd36a;--drop:#8d94a3}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 50% 0,#1e2027 0,#0c0d10 38%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}
    button{font:inherit}
    .app{width:min(100%,720px);margin:auto;padding:18px 14px calc(28px + env(safe-area-inset-bottom))}
    header{display:grid;gap:8px;margin:4px 2px 16px}
    .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:800}
    h1{font-size:clamp(24px,7vw,40px);line-height:1.12;margin:0;letter-spacing:-.04em}
    .lead{margin:0;color:var(--sub);font-size:14px;line-height:1.7}
    .rule{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
    .rule div{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#121419;font-size:12px;line-height:1.55}
    .rule b{display:block;color:#fff;margin-bottom:2px}
    .progress{height:4px;background:#252830;border-radius:9px;overflow:hidden;margin:18px 2px 9px}
    .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ffb266);transition:width .25s}
    .counter{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;margin:0 2px 8px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 22px 70px #0008}
    .visual{position:relative;background:#090a0d}
    .visual img{display:block;width:100%;height:auto;aspect-ratio:941/1672;object-fit:contain}
    .tag{position:absolute;top:12px;left:12px;background:#08090bd9;border:1px solid #ffffff2b;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;backdrop-filter:blur(12px)}
    .copy{padding:17px 16px 14px}
    h2{margin:0 0 5px;font-size:22px;letter-spacing:-.03em}
    .benchmark{color:#ffbcae;font-size:12px;font-weight:700;margin-bottom:8px}
    .desc{margin:0;color:#c8cbd2;font-size:13px;line-height:1.65}
    .aspects{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
    .aspect{border:1px solid #3b404a;background:#101217;color:#c7cad1;border-radius:999px;padding:8px 10px;font-size:12px}
    .aspect[aria-pressed="true"]{border-color:#fff;color:#fff;background:#343944}
    .question{font-weight:800;margin:18px 2px 9px}
    .choices{display:grid;gap:9px}
    .choice{min-height:54px;border-radius:14px;border:1px solid var(--line);background:#17191f;color:#fff;text-align:left;padding:11px 13px;font-weight:800}
    .choice small{display:block;color:var(--sub);font-weight:500;margin-top:3px}
    .choice[data-v="keep"][aria-pressed="true"]{border-color:var(--good);background:#15362f}
    .choice[data-v="mix"][aria-pressed="true"]{border-color:var(--mix);background:#3a3018}
    .choice[data-v="drop"][aria-pressed="true"]{border-color:var(--drop);background:#292c33}
    textarea{width:100%;min-height:70px;margin-top:10px;border-radius:12px;border:1px solid var(--line);background:#101217;color:#fff;padding:11px;font:inherit;resize:vertical}
    .nav{display:grid;grid-template-columns:1fr 1.35fr;gap:9px;margin-top:12px}
    .nav button,.finish button,.reference button{min-height:50px;border-radius:14px;border:1px solid var(--line);font-weight:800}
    .prev{background:#17191f;color:#fff}
    .next{background:#f1eee6;color:#111}
    .finish{display:none;margin-top:14px;background:#15171c;border:1px solid var(--line);border-radius:18px;padding:16px}
    .finish h3{margin:0 0 6px}
    .finish p{color:var(--sub);font-size:13px;line-height:1.6}
    .finish button{width:100%;background:linear-gradient(135deg,#ff6247,#ff9a55);color:#111;border:none}
    .reference{margin-top:12px;text-align:center}
    .reference button{background:transparent;color:var(--sub);padding:0 16px}
    dialog{width:min(94vw,640px);border:1px solid var(--line);border-radius:18px;background:#111319;color:#fff;padding:12px;box-shadow:0 30px 100px #000}
    dialog::backdrop{background:#000c}
    dialog img{display:block;width:100%;border-radius:12px}
    dialog button{width:100%;min-height:48px;margin-top:10px;border:0;border-radius:12px;background:#f1eee6;color:#111;font-weight:800}
    .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#f1eee6;color:#111;padding:11px 15px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}
    .toast.show{opacity:1}
    @media(max-width:420px){.app{padding-left:10px;padding-right:10px}.rule{grid-template-columns:1fr}.copy{padding:15px 13px}.card{border-radius:16px}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">ART DIRECTION STUDY / 2026-08-20</div>
      <h1>構図を変えず、画風だけを選ぶ。</h1>
      <p class="lead">8案すべて、同じ席・同じ卓・同じ牌・同じPOT・同じ操作位置です。会場案ではなく、どの美術監督の思想で製品化するかを比較します。</p>
      <div class="rule"><div><b>固定</b>カメラ／6人配置／卓／情報階層／操作位置</div><div><b>比較</b>キャラの描線／顔／素材／光／色／ボタンの質感</div></div>
    </header>

    <div class="progress"><i id="bar"></i></div>
    <div class="counter"><span id="count"></span><span>回答はこの端末に自動保存</span></div>

    <article class="card">
      <div class="visual"><img id="image" alt=""><div class="tag" id="tag"></div></div>
      <div class="copy">
        <h2 id="title"></h2>
        <div class="benchmark" id="benchmark"></div>
        <p class="desc" id="desc"></p>
        <div class="aspects" id="aspects" aria-label="良い要素"></div>
      </div>
    </article>

    <div class="question">この画風を、製品の本線にしたいですか？</div>
    <div class="choices">
      <button class="choice" data-v="keep" aria-pressed="false">この画風を本線にしたい<small>タイトル・ロビー・対局・ガチャまで展開したい</small></button>
      <button class="choice" data-v="mix" aria-pressed="false">良い要素だけ使いたい<small>下の「キャラ・牌・ボタン・光・世界観」も選べます</small></button>
      <button class="choice" data-v="drop" aria-pressed="false">今回は使わない<small>この描画体系は候補から外す</small></button>
    </div>
    <textarea id="note" placeholder="任意：顔は良い、ボタンは違う、など"></textarea>
    <div class="nav"><button class="prev" id="prev">前へ</button><button class="next" id="next">決定して次へ</button></div>

    <section class="finish" id="finish">
      <h3>8案の選定が完了しました</h3>
      <p>ボタンを押すと、選定結果をそのままChatGPT Workへ貼れる日本語にまとめます。</p>
      <button id="copy">選定結果をコピー</button>
    </section>
    <div class="reference"><button id="reference">固定した元構図を見る</button></div>
  </main>

  <dialog id="dialog"><img src="assets/00-layout-reference.webp" alt="固定した元構図"><button id="closeDialog">閉じる</button></dialog>
  <div class="toast" id="toast">コピーしました</div>

  <script>
    const items=[
      {id:'premium-2d5',file:'01-premium-2d5-anime.webp',title:'高級2.5Dアニメ',benchmark:'参考原理：2Dに見える3D格闘ゲーム／高級アニメRPG',desc:'線画の明瞭さと立体素材を両立。キャラクター商品性を最優先しつつ、長時間遊べる黒基調へ。'},
      {id:'manga-noir',file:'02-manga-noir.webp',title:'現代漫画ノワール',benchmark:'参考原理：Persona系の画面統一／青年漫画の強い描線',desc:'人物・卓・UIを一つの漫画作品として統一。黒・生成り・朱だけで心理戦を最大化。'},
      {id:'soft-collectible',file:'03-soft-collectible.webp',title:'ソフト・コレクティブル',benchmark:'参考原理：Pokémon TCG Pocketの触覚性と余白',desc:'柔らかな手描きキャラ、透ける磁器牌、朝の光。収集したくなる親密さと高級感を重視。'},
      {id:'urban-3d',file:'04-urban-designer-3d.webp',title:'アーバン・デザイナー3D',benchmark:'参考原理：Zenless Zone Zeroの現代服・素材・シルエット設計',desc:'東京の現代クリエイターを思わせるキャスト。成形樹脂・金属・透明部品で操作欲を作る。'},
      {id:'live-action',file:'05-live-action-suspense.webp',title:'実写サスペンス',benchmark:'参考原理：LOST JUDGMENT級の日本人群像と映画照明',desc:'年齢・骨格・表情が異なる実在感ある大人たち。静かな圧力と精密機器の質感で勝負。'},
      {id:'painterly',file:'06-painterly-prestige.webp',title:'絵画的アニメドラマ',benchmark:'参考原理：受賞級RPGの筆致と色面／手描きキービジュアル',desc:'筆の跡、失われる輪郭、濃紺と暖色の色面。画面を一枚の絵として所有したくなる方向。'},
      {id:'cinematic-comic',file:'07-cinematic-comic.webp',title:'シネマティック・コミック',benchmark:'参考原理：Marvel Snapの一秒理解とキャラクター分離',desc:'強いリムライトと色分けで、誰が主役かを一瞬で伝える。対決・ガチャ・コラボに強い。'},
      {id:'designer-pop',file:'08-designer-pop.webp',title:'デザイナーポップ',benchmark:'参考原理：Splatoonの色・素材・ファッションを貫く美術統一',desc:'大きな色面、マット素材、明快なシルエット。軽快だが子どもっぽくしない現代日本デザイン。'}
    ];
    const labels={keep:'この画風を本線にしたい',mix:'良い要素だけ使いたい',drop:'今回は使わない'};
    const aspectLabels=['キャラ画風','牌・卓','ボタン・UI','光・色','世界観'];
    const key='mahjong-holdem-art-direction-2026-08-20';
    const state=JSON.parse(localStorage.getItem(key)||'{}');
    let index=0;
    const $=s=>document.querySelector(s);
    function save(){localStorage.setItem(key,JSON.stringify(state))}
    function current(){return items[index]}
    function render(){
      const item=current(),answer=state[item.id]||{verdict:'',aspects:[],note:''};
      $('#image').src='assets/'+item.file; $('#image').alt=item.title;
      $('#tag').textContent='STYLE '+String(index+1).padStart(2,'0');
      $('#title').textContent=item.title; $('#benchmark').textContent=item.benchmark; $('#desc').textContent=item.desc;
      $('#count').textContent=`${index+1} / ${items.length}`; $('#bar').style.width=((index+1)/items.length*100)+'%';
      document.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===answer.verdict)));
      $('#note').value=answer.note||'';
      $('#aspects').innerHTML='';
      aspectLabels.forEach(label=>{const b=document.createElement('button');b.className='aspect';b.textContent=label;b.setAttribute('aria-pressed',String((answer.aspects||[]).includes(label)));b.onclick=()=>toggleAspect(label);$('#aspects').appendChild(b)});
      $('#prev').disabled=index===0; $('#prev').style.opacity=index===0?'.35':'1';
      $('#next').textContent=index===items.length-1?'この案を保存':'決定して次へ';
      $('#finish').style.display=Object.keys(state).filter(id=>state[id]?.verdict).length===items.length?'block':'none';
      scrollTo({top:0,behavior:'smooth'});
    }
    function update(patch){const item=current();state[item.id]={verdict:'',aspects:[],note:'',...(state[item.id]||{}),...patch};save();render()}
    function toggleAspect(label){const a=new Set(state[current().id]?.aspects||[]);a.has(label)?a.delete(label):a.add(label);update({aspects:[...a]})}
    document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>update({verdict:b.dataset.v}));
    $('#note').oninput=e=>{const item=current();state[item.id]={verdict:'',aspects:[],note:'',...(state[item.id]||{}),note:e.target.value};save()};
    $('#prev').onclick=()=>{if(index>0){index--;render()}};
    $('#next').onclick=()=>{if(!state[current().id]?.verdict){alert('3つのうち1つを選んでください');return}if(index<items.length-1){index++;render()}else{$('#finish').style.display='block';$('#finish').scrollIntoView({behavior:'smooth'})}};
    $('#reference').onclick=()=>$('#dialog').showModal(); $('#closeDialog').onclick=()=>$('#dialog').close();
    $('#copy').onclick=async()=>{const groups={keep:[],mix:[],drop:[]};items.forEach(item=>{const a=state[item.id]||{};let line=`・${item.title}`;if(a.aspects?.length)line+=`（良い要素：${a.aspects.join('、')}）`;if(a.note?.trim())line+=` — ${a.note.trim()}`;(groups[a.verdict]||groups.drop).push(line)});const text=`麻雀ホールデム　画風選定結果\n\nこの画風を本線にしたい\n${groups.keep.join('\n')||'・該当なし'}\n\n良い要素だけ使いたい\n${groups.mix.join('\n')||'・該当なし'}\n\n今回は使わない\n${groups.drop.join('\n')||'・該当なし'}`;await navigator.clipboard.writeText(text);$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1600)};
    render();
  </script>
</body>
</html>
