    *{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 50% 0,#153b30 0,#071b17 34%,#030b09 100%);color:var(--ivory);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}

    .summary{margin-top:14px;border:1px solid #4b5b55;background:#081611;border-radius:18px;padding:14px}.summary-row{display:flex;gap:8px;justify-content:space-between;align-items:center}.counts{font-size:13px;color:#c8d2ce;line-height:1.8}.copy{min-height:48px;border:1px solid #c5a04c;border-radius:13px;background:linear-gradient(#fff0c8,#b7862c);color:#171005;font-weight:900;padding:0 16px}.hint{font-size:11px;color:#8fa099;margin-top:9px;line-height:1.6}
    @media (max-width:480px){.app{padding-inline:8px}.top{padding-inline:6px}.choices{gap:6px;padding:10px}.choice{font-size:13px;padding:6px}.frame img{max-height:70dvh}.nav button{width:44px;height:64px;margin:4px}.summary-row{align-items:stretch;flex-direction:column}.copy{width:100%}}

</head>
<body>
<main class="app">
  <header class="top"><div><h1>麻雀ホールデム 最終ビジュアル選定</h1><div class="sub">1画面ずつ直感で選んでください。英語の内部コードは表示しません。</div></div><div class="progress" id="progress">1 / 29</div></header>

</main>

 {id:'22',file:'22-character-roster.webp',group:'キャラクター',dir:'現代日本プレミアム',title:'キャラクター一覧',note:'ガビガビ感をなくし、9人を同じ品質で比較できる。'},

 {id:'23',file:'23-cosmetic-customization.webp',group:'収集・装飾',dir:'現代日本プレミアム',title:'装飾品設定',note:'実際の対局プレビューと素材差が見える4候補。'},
 {id:'24',file:'24-gacha-pickup.webp',group:'収集・装飾',dir:'現代日本プレミアム',title:'装飾品ガチャ',note:'現代服、3つの目玉商品、2つの大きな抽選操作へ集約。'},
 {id:'25',file:'25-gacha-result-tabs.webp',group:'収集・装飾',dir:'現代日本プレミアム',title:'ガチャ結果｜10件タブ切替',note:'選択中の1品を大きく見せ、10件は横タブで瞬時に切り替える。'}
];
const groups=['すべて',...new Set(items.map(x=>x.group))];
const key='mahjong-holdem-final-visual-2026-08-19';let filter='すべて',list=[...items],index=0;
let votes={};try{votes=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
const $=s=>document.querySelector(s), image=$('#image'),title=$('#title'),note=$('#note'),eyebrow=$('#eyebrow'),progress=$('#progress');
function save(){localStorage.setItem(key,JSON.stringify(votes))}
function updateCounts(){const c={keep:0,mix:0,drop:0};Object.values(votes).forEach(v=>c[v]++);$('#counts').innerHTML=`この方向で進めたい ${c.keep}件<br>良い部分だけ使いたい ${c.mix}件<br>今回は使わない ${c.drop}件<br>未回答 ${items.length-c.keep-c.mix-c.drop}件`}
function render(){const x=list[index];if(!x)return;image.src='assets/'+x.file;image.alt=x.title;title.textContent=x.title;note.textContent=x.note;eyebrow.textContent=x.group+' ／ '+x.dir;progress.textContent=(index+1)+' / '+list.length;document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('on',votes[x.id]===b.dataset.v));updateCounts();window.scrollTo({top:0,behavior:'smooth'})}
function move(d){index=(index+d+list.length)%list.length;render()}
function setFilter(g){filter=g;list=g==='すべて'?[...items]:items.filter(x=>x.group===g);index=0;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('on',b.dataset.g===g));render()}
groups.forEach(g=>{const b=document.createElement('button');b.className='filter'+(g==='すべて'?' on':'');b.dataset.g=g;b.textContent=g;b.onclick=()=>setFilter(g);$('#filters').appendChild(b)});
$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{votes[list[index].id]=b.dataset.v;save();render();setTimeout(()=>move(1),180)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
$('#copy').onclick=async()=>{const label={keep:'この方向で進めたい',mix:'良い部分だけ使いたい',drop:'今回は使わない'};let out='麻雀ホールデム　最終ビジュアル選定結果\n\n';['keep','mix','drop'].forEach(v=>{out+=label[v]+'\n';items.filter(x=>votes[x.id]===v).forEach(x=>out+='・'+x.title+'\n');out+='\n'});out+='未回答：'+items.filter(x=>!votes[x.id]).length+'件';await navigator.clipboard.writeText(out);$('#copy').textContent='コピーしました';setTimeout(()=>$('#copy').textContent='選定結果をコピー',1400)};
render();
