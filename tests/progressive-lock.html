<!doctype html><html lang="ja"><meta charset="utf-8"><title>progressive lock tests</title><style>body{font-family:monospace}iframe{width:390px;height:844px;border:1px solid #999}.ok{color:green}.ng{color:red}</style><h1>段階固定4→4</h1><div id="out"></div><iframe id="game" src="../experiments/progressive-lock/index.html?stage=preflop"></iframe><script>
const out=document.getElementById('out');let pass=0,fail=0;
function t(name,yes){const p=document.createElement('p');p.className=yes?'ok':'ng';p.textContent=(yes?'PASS  ':'FAIL  ')+name;out.appendChild(p);yes?pass++:fail++;}
game.onload=()=>{const api=game.contentWindow.ProgressiveLockMock,doc=game.contentDocument;
 t('APIを公開',!!api);t('上部に5状態',doc.querySelectorAll('.step').length===5);t('画面文言は日本語',!/KEEP|MIX|DROP|POT|FOLD|CALL|RAISE/.test(doc.body.innerText));t('現在状態を読み上げ可能',doc.querySelectorAll('.step[aria-current="step"]').length===1);t('操作部は画面下に固定',game.contentWindow.getComputedStyle(doc.getElementById('actions').parentElement).position==='fixed');
 t('プリフロップは固定0',api.getState().locked.length===0);t('プリフロップは選択0',api.getState().draft.length===0);
 api.loadStage(1);t('フロップ候補は4枚',api.getState().draft.length===4);t('選択牌を読み上げ可能',doc.querySelector('.tile.draft').getAttribute('aria-pressed')==='true'&&!/^(Man|Pin|Sou)/.test(doc.querySelector('.tile.draft').getAttribute('aria-label')));api.confirm();t('フロップ確定で固定4',api.getState().locked.length===4);t('固定牌は見える',game.contentWindow.getComputedStyle(doc.querySelector('.tile.locked')).opacity==='1');t('固定牌は操作不可',doc.querySelector('.tile.locked').disabled);t('ターンへ進む',api.getState().stage===2);
 const before=api.getState().draft.length;api.toggle(api.getState().locked[0]);t('固定牌を解除できない',api.getState().draft.length===before);
 ['p4','c3','c4','t1'].forEach(x=>api.toggle(x));api.confirm();t('ターン確定で固定8',api.getState().locked.length===8);t('リバーへ進む',api.getState().stage===3);
 ['p0','p1','p2','c9','c10','r3','r2'].forEach(x=>api.toggle(x));t('自由枠は6枚上限',api.getState().draft.length===6);api.confirm();t('最終14枚で決着',api.getState().stage===4&&api.getState().locked.length+api.getState().draft.length===14);t('決着では賭け操作を隠す',doc.getElementById('actions').hidden);t('最終14枚を一人ずつ表示',doc.querySelectorAll('#final .tile').length===14);t('元の私牌8枚を一人ずつ表示',doc.querySelectorAll('#shownPrivate .tile').length===8);t('6人を同じ領域で切替',doc.querySelectorAll('#ranking .rank').length===6);t('表示中の人を読み上げ可能',doc.querySelectorAll('#ranking .rank[aria-pressed="true"]').length===1);t('偽の役名を表示しない',!/七対子|国士|役満|三色|一気通貫|対々和/.test(doc.getElementById('showdown').textContent));
 const sum=document.createElement('h2');sum.textContent=`${pass} PASS / ${fail} FAIL`;out.prepend(sum);
};
</script></html>
