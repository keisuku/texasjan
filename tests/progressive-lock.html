<!doctype html><html lang="ja"><meta charset="utf-8"><title>progressive lock tests</title><style>body{font-family:monospace}iframe{width:390px;height:844px;border:1px solid #999}.ok{color:green}.ng{color:red}</style><h1>段階固定4→2 / 4→4</h1><div id="out"></div><iframe id="game" src="../experiments/progressive-lock/index.html?rule=4-2&stage=preflop"></iframe><script>
const out=document.getElementById('out');let pass=0,fail=0;
function t(name,yes){const p=document.createElement('p');p.className=yes?'ok':'ng';p.textContent=(yes?'PASS  ':'FAIL  ')+name;out.appendChild(p);yes?pass++:fail++;}
game.onload=()=>{const api=game.contentWindow.ProgressiveLockMock,doc=game.contentDocument;
 t('APIを公開',!!api);t('既定は4→2',api.getState().rule==='4-2');t('上部に5状態',doc.querySelectorAll('.step').length===5);t('2ルールを切替可能',doc.querySelectorAll('[data-rule]').length===2);t('画面文言は日本語',!/KEEP|MIX|DROP|POT|FOLD|CALL|RAISE/.test(doc.body.innerText));t('現在状態を読み上げ可能',doc.querySelectorAll('.step[aria-current="step"]').length===1);t('操作部は画面下に固定',game.contentWindow.getComputedStyle(doc.getElementById('actions').parentElement).position==='fixed');
 t('開始時は固定0',api.getState().locked.length===0);t('開始時は選択0',api.getState().draft.length===0);
 api.loadStage(1);t('フロップ候補は4枚',api.getState().draft.length===4);t('選択牌を読み上げ可能',doc.querySelector('.tile.draft').getAttribute('aria-pressed')==='true'&&!/^(Man|Pin|Sou)/.test(doc.querySelector('.tile.draft').getAttribute('aria-label')));api.confirm();t('フロップ確定で固定4',api.getState().locked.length===4);t('固定牌は見える',game.contentWindow.getComputedStyle(doc.querySelector('.tile.locked')).opacity==='1');t('固定牌は操作不可',doc.querySelector('.tile.locked').disabled);t('ターンへ進む',api.getState().stage===2);
 const before=api.getState().draft.length;api.toggle(api.getState().locked[0]);t('固定牌を解除できない',api.getState().draft.length===before);t('相手の後固定2枚を常時表示',doc.querySelectorAll('.laterOpen:not([hidden])').length===2&&doc.querySelectorAll('.laterOpen:not([hidden]) .miniTile').length===4);t('拡大導線は44px',parseFloat(game.contentWindow.getComputedStyle(doc.querySelector('.laterOpen:not([hidden])')).minHeight)>=44);
 ['p4','t1'].forEach(x=>api.toggle(x));api.confirm();t('追加2枚確定で固定6',api.getState().locked.length===6);t('リバーへ進む',api.getState().stage===3);
 ['p0','p1','p2','c3','c4','c9','c10','r3','r2'].forEach(x=>api.toggle(x));t('自由枠は8枚上限',api.getState().draft.length===8);api.confirm();t('固定6＋自由8で決着',api.getState().stage===4&&api.getState().locked.length+api.getState().draft.length===14);
 api.setRule('4-4');api.loadStage(1);api.confirm();['p4','c3','c4','t1'].forEach(x=>api.toggle(x));api.confirm();t('比較用4→4も固定8',api.getState().rule==='4-4'&&api.getState().locked.length===8);
 const sum=document.createElement('h2');sum.textContent=`${pass} PASS / ${fail} FAIL`;out.prepend(sum);
};
</script></html>
