<!doctype html><html lang="ja"><meta charset="utf-8"><title>progressive lock tests</title><style>body{font-family:monospace}iframe{width:390px;height:844px;border:1px solid #999}.ok{color:green}.ng{color:red}</style><h1>段階固定4→4</h1><div id="out"></div><iframe id="game" src="../experiments/progressive-lock/index.html?stage=preflop"></iframe><script>
const out=document.getElementById('out');let pass=0,fail=0;
function t(name,yes){const p=document.createElement('p');p.className=yes?'ok':'ng';p.textContent=(yes?'PASS  ':'FAIL  ')+name;out.appendChild(p);yes?pass++:fail++;}
game.onload=()=>{const api=game.contentWindow.ProgressiveLockMock;
 t('APIを公開',!!api);t('プリフロップは固定0',api.getState().locked.length===0);t('プリフロップは選択0',api.getState().draft.length===0);
 api.loadStage(1);t('フロップ候補は4枚',api.getState().draft.length===4);api.confirm();t('フロップ確定で固定4',api.getState().locked.length===4);t('ターンへ進む',api.getState().stage===2);
 const before=api.getState().draft.length;api.toggle(api.getState().locked[0]);t('固定牌を解除できない',api.getState().draft.length===before);
 ['p4','c3','c4','t1'].forEach(x=>api.toggle(x));api.confirm();t('ターン確定で固定8',api.getState().locked.length===8);t('リバーへ進む',api.getState().stage===3);
 ['p0','p1','p2','c9','c10','r3','r2'].forEach(x=>api.toggle(x));t('自由枠は6枚上限',api.getState().draft.length===6);api.confirm();t('最終14枚で決着',api.getState().stage===4&&api.getState().locked.length+api.getState().draft.length===14);
 const sum=document.createElement('h2');sum.textContent=`${pass} PASS / ${fail} FAIL`;out.prepend(sum);
};
</script></html>
