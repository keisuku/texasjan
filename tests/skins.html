<!doctype html><meta charset="utf-8">
<title>スキンシステムの検査 — MAHJONG HOLD'EM</title>
<style>html,body{margin:0}iframe{width:941px;height:1672px;border:0}
pre{position:fixed;z-index:9;background:#fff;font:12px/1.6 monospace;padding:6px;margin:0}</style>
<body><pre id="out">running</pre>
<script>
const log=[];function ok(c,m){log.push((c?"PASS  ":"FAIL  ")+m);}
const f=document.createElement("iframe");
f.src="../index.html?still=1&screen=game";
document.body.appendChild(f);

f.onload=function(){setTimeout(function(){
  const d=f.contentDocument, w=f.contentWindow, root=d.documentElement;
  const bg=function(sel){return w.getComputedStyle(d.querySelector(sel)).backgroundImage;};
  const commons=function(){return d.querySelectorAll("#commons .tile").length;};

  /* ---- カタログが読めているか ---- */
  const S=w.MH_SKINS;
  ok(!!S,"skins/manifest.js が読み込まれている");
  ok(S&&S.slots.length>=7,"スロットが7種類ある (got "+((S&&S.slots.length)||0)+")");
  ok(S&&S.skins.length>=10,"スキンが10件以上登録されている (got "+((S&&S.skins.length)||0)+")");
  S.slots.forEach(function(sl){
    ok(w.skinsForSlot(sl.id).length>0,"スロット「"+sl.name+"」に選択肢がある");
    ok(w.skinsForSlot(sl.id).some(function(x){return x.owned!==false;}),
       "スロット「"+sl.name+"」に所持済みの既定がある");
  });

  /* ---- 既定の状態 ---- */
  ok(root.getAttribute("data-skin-frame")==="heavy",
     "既定の枠スキンは heavy (got "+root.getAttribute("data-skin-frame")+")");
  ok(/btn-call\.png/.test(bg(".betBar .call")),"既定でCALLがPNG素材 ("+bg(".betBar .call").slice(0,60)+")");
  ok(root.classList.contains("has-tile-body-flat"),"既定で牌の素材が有効");
  ok(/arena-with-characters/.test(bg("#screen-game")),"既定の卓は arena-with-characters");

  const before=commons();

  /* ---- 枠スキンを切り替える ---- */
  w.skinSelect("frame","sharp");
  ok(root.getAttribute("data-skin-frame")==="sharp","切替後 data-skin-frame=sharp");
  ok(/svg\/btn-call\.svg/.test(bg(".betBar .call")),
     "切替でCALLがSVGへ実際に変わった ("+bg(".betBar .call").slice(0,70)+")");
  ok(/svg\/frame-gold-plate\.svg/.test(bg(".pot")),"POTプレートもSVGへ変わった");

  /* ---- 卓スキンを切り替える ---- */
  w.skinSelect("arena","empty");
  ok(/golden-arena-backplate/.test(bg("#screen-game")),
     "卓の切替で対局画面の背景が変わった ("+bg("#screen-game").slice(0,70)+")");

  /* ---- 素材を持たないスキンはCSS手描きへ戻る ---- */
  w.skinSelect("tile","line");
  ok(!root.classList.contains("has-tile-body-flat"),
     "素材なしスキンでは has-tile-body-flat が外れる");
  ok(root.getAttribute("data-skin-tile")==="line","data-skin-tile=line");
  const tileBg=bg("#commons .tile");
  ok(/gradient/.test(tileBg)&&!/tile-body-flat/.test(tileBg),
     "牌がCSS手描きへフォールバックした");

  /* ---- 未所持は選べない ---- */
  w.skinSelect("tile","obsidian");
  ok(root.getAttribute("data-skin-tile")!=="obsidian",
     "未所持スキンは選択されない (got "+root.getAttribute("data-skin-tile")+")");

  /* ---- 選択は記憶される ---- */
  ok(w.skinChosen("frame")==="sharp","選択が保持されている（frame=sharp）");
  ok(w.skinChosen("arena")==="empty","選択が保持されている（arena=empty）");

  /* ---- 対局の状態は壊れていない ---- */
  ok(commons()===before&&before===15,
     "スキンを切り替えても共通15枚はそのまま (before="+before+" after="+commons()+")");
  ok(d.querySelectorAll("#myrow .tile").length===8,"私牌8枚もそのまま");

  /* ---- 既定へ戻す ---- */
  w.skinSelect("frame","heavy");w.skinSelect("arena","jade");w.skinSelect("tile","ivory");
  ok(/btn-call\.png/.test(bg(".betBar .call")),"既定へ戻せる");

  /* ---- 画面遷移 ---- */
  const screens=["title","lobby","cosmetics","shop","game"];
  screens.forEach(function(s){
    w.go(s);
    const on=d.querySelectorAll(".screen.on");
    ok(on.length===1&&on[0].id==="screen-"+s,"go('"+s+"') で "+s+" だけが表示される");
  });
  w.go("cosmetics");
  ok(d.querySelectorAll("#cosRail .cos-cat").length===S.slots.length,
     "装飾品設定のカテゴリ数がスロット数と一致");
  ok(d.querySelectorAll("#cosGrid .cos-item").length>0,"アイテム格子が描画されている");
  ok(d.querySelectorAll("#cosPrevStage .tile").length>0,"プレビューに牌が描画されている");
  w.go("game");
  ok(d.querySelectorAll("#commons .tile").length===15,"対局画面へ戻っても共通15枚が揃っている");

  document.getElementById("out").textContent=
    log.join("\n")+"\n\n"+log.filter(function(l){return l[0]==="F";}).length+" FAIL / "+log.length+" total";
},700);};
</script>
