<!doctype html><meta charset="utf-8">
<title>スキンシステムの検査 — MAHJONG HOLD'EM</title>
<style>html,body{margin:0}iframe{width:941px;height:1672px;border:0}
pre{position:fixed;z-index:9;background:#fff;font:12px/1.6 monospace;padding:6px;margin:0}</style>
<body><pre id="out">running</pre>
<script>
const log=[];function ok(c,m){log.push((c?"PASS  ":"FAIL  ")+m);}
const f=document.createElement("iframe");
f.src="../index.html?still=1&screen=game";
document.body.appendChild(f);

f.onload=function(){setTimeout(function(){
  const d=f.contentDocument, w=f.contentWindow, root=d.documentElement;
  const bg=function(sel){return w.getComputedStyle(d.querySelector(sel)).backgroundImage;};
  const commons=function(){return d.querySelectorAll("#commons .tile").length;};

  /* ---- カタログが読めているか ---- */
  const S=w.MH_SKINS;
  ok(!!S,"skins/manifest.js が読み込まれている");
  ok(S&&S.slots.length>=7,"スロットが7種類ある (got "+((S&&S.slots.length)||0)+")");
  ok(S&&S.skins.length>=10,"スキンが10件以上登録されている (got "+((S&&S.skins.length)||0)+")");
  S.slots.forEach(function(sl){
    ok(w.skinsForSlot(sl.id).length>0,"スロット「"+sl.name+"」に選択肢がある");
    ok(w.skinsForSlot(sl.id).some(function(x){return x.owned!==false;}),
       "スロット「"+sl.name+"」に所持済みの既定がある");
  });

  /* ---- 既定の状態 ---- */
  ok(root.getAttribute("data-skin-frame")==="heavy",
     "既定の枠スキンは heavy (got "+root.getAttribute("data-skin-frame")+")");
  ok(/btn-call\.png/.test(bg(".betBar .call")),"既定でCALLがPNG素材 ("+bg(".betBar .call").slice(0,60)+")");
  ok(root.classList.contains("has-tile-body-flat"),"既定で牌の素材が有効");
  ok(/arena-with-characters/.test(bg("#screen-game")),"既定の卓は arena-with-characters");

  const before=commons();

  /* ---- 枠スキンを切り替える ---- */
  w.skinSelect("frame","sharp");
  ok(root.getAttribute("data-skin-frame")==="sharp","切替後 data-skin-frame=sharp");
  ok(/svg\/btn-call\.svg/.test(bg(".betBar .call")),
     "切替でCALLがSVGへ実際に変わった ("+bg(".betBar .call").slice(0,70)+")");
  ok(/svg\/frame-gold-plate\.svg/.test(bg(".pot")),"POTプレートもSVGへ変わった");

  /* ---- 卓スキンを切り替える ---- */
  w.skinSelect("arena","empty");
  ok(/golden-arena-backplate/.test(bg("#screen-game")),
     "卓の切替で対局画面の背景が変わった ("+bg("#screen-game").slice(0,70)+")");

  /* ---- 素材を持たないスキンはCSS手描きへ戻る ---- */
  w.skinSelect("tile","line");
  ok(!root.classList.contains("has-tile-body-flat"),
     "素材なしスキンでは has-tile-body-flat が外れる");
  ok(root.getAttribute("data-skin-tile")==="line","data-skin-tile=line");
  const tileBg=bg("#commons .tile");
  ok(/gradient/.test(tileBg)&&!/tile-body-flat/.test(tileBg),
     "牌がCSS手描きへフォールバックした");

  /* ---- 未所持は選べない ---- */
  w.skinSelect("tile","obsidian");
  ok(root.getAttribute("data-skin-tile")!=="obsidian",
     "未所持スキンは選択されない (got "+root.getAttribute("data-skin-tile")+")");

  /* ---- 選択は記憶される ---- */
  ok(w.skinChosen("frame")==="sharp","選択が保持されている（frame=sharp）");
  ok(w.skinChosen("arena")==="empty","選択が保持されている（arena=empty）");

  /* ---- 対局の状態は壊れていない ---- */
  ok(commons()===before&&before===15,
     "スキンを切り替えても共通15枚はそのまま (before="+before+" after="+commons()+")");
  ok(d.querySelectorAll("#myrow .tile").length===8,"私牌8枚もそのまま");

  /* ---- 既定へ戻す ---- */
  w.skinSelect("frame","heavy");w.skinSelect("arena","jade");w.skinSelect("tile","ivory");
  ok(/btn-call\.png/.test(bg(".betBar .call")),"既定へ戻せる");

  /* ---- 画面遷移 ---- */
  const screens=["title","lobby","match","cosmetics","shop","game","result"];
  screens.forEach(function(s){
    w.go(s);
    const on=d.querySelectorAll(".screen.on");
    ok(on.length===1&&on[0].id==="screen-"+s,"go('"+s+"') で "+s+" だけが表示される");
  });
  w.go("cosmetics");
  ok(d.querySelectorAll("#cosRail .cos-cat").length===S.slots.length,
     "装飾品設定のカテゴリ数がスロット数と一致");
  ok(d.querySelectorAll("#cosGrid .cos-item").length>0,"アイテム格子が描画されている");
  ok(d.querySelectorAll("#cosPrevStage .tile").length>0,"プレビューに牌が描画されている");
  w.go("game");
  ok(d.querySelectorAll("#commons .tile").length===15,"対局画面へ戻っても共通15枚が揃っている");

  /* ---- 局の進行ボタン ---- */
  const bn=d.getElementById("bNext");
  const R=function(sel){const e=d.querySelector(sel);return e?e.getBoundingClientRect():null;};
  const overlap=function(a,b){return a&&b&&a.left<b.right&&b.left<a.right&&a.top<b.bottom&&b.top<a.bottom;};
  ok(w.getComputedStyle(bn).display!=="none","進行ボタンが表示されている");
  const nb=bn.getBoundingClientRect();
  ok(nb.width>200&&nb.height>40,"進行ボタンが十分な大きさ ("+Math.round(nb.width)+"x"+Math.round(nb.height)+")");
  ok(!overlap(nb,R(".sourceZone")),"進行ボタンが私牌8枚と重なっていない");
  ok(!overlap(nb,R(".labelFinal")),"進行ボタンが MY FINAL HAND の見出しと重なっていない");
  ok(!overlap(nb,R("#rack")),"進行ボタンが最終手牌と重なっていない");
  w.fastForwardBetting();
  ok(/を公開/.test(bn.textContent),"進行ボタンが次に開く枠を示している ("+bn.textContent+")");

  const st0=w.eval("stage");
  bn.click();
  ok(w.eval("stage")===st0+1,"進行ボタンで局が進む ("+st0+" -> "+w.eval("stage")+")");
  w.fastForwardBetting();bn.click();w.fastForwardBetting();
  ok(w.eval("stage")===3&&w.eval("common.length")===23,"+4 を2つ開くと共通23枚 (stage="+w.eval("stage")+")");
  ok(/あと \d+ 枚えらぶ/.test(bn.textContent)&&bn.disabled,
     "14枚そろう前は残り枚数を示して押せない ("+bn.textContent+")");
  ok(d.getElementById("bCall").disabled,"ベッティング完了後は CALL が無効");

  d.getElementById("bRec").click();          /* おすすめで14枚そろえる */
  ok(w.eval("picks.length")===14,"おすすめで14枚そろった (got "+w.eval("picks.length")+")");
  ok(/ショーダウン/.test(bn.textContent)&&!bn.disabled,
     "14枚そろうと「ショーダウン」が押せる ("+bn.textContent+")");

  bn.click();
  ok(w.eval('phase')==="result","ショーダウンで決着した");
  ok(/結果を見る/.test(bn.textContent),"決着後は「結果を見る」になる ("+bn.textContent+")");
  const nb2=bn.getBoundingClientRect();
  ok(!overlap(nb2,R(".winRibbon.result")),"決着表示と進行ボタンが重なっていない");
  ok(!overlap(nb2,R(".labelFinal")),"決着時も見出しと重なっていない");

  bn.click();
  ok(d.getElementById("screen-result").classList.contains("on"),"「結果を見る」で独立した結果画面へ進む");
  ok(d.querySelectorAll("#rsRanking .rs-rankrow").length===6,"結果画面に6人の順位が表示される");
  ok(d.getElementById("rsTiles").children.length>0,"結果画面に最終手牌またはFOLD状態が表示される");
  d.getElementById("bResultAgain").click();
  ok(w.eval('phase')==="play"&&w.eval("stage")===1,"「もう一局」で新しい局が始まる");
  ok(d.getElementById("screen-game").classList.contains("on"),"再戦で対局画面へ戻る");
  ok(d.querySelectorAll("#commons .tile").length===15,"新しい局でも共通15枚");

  /* ---- ガチャ: 引く → 所持する → 装備できる ---- */
  w.go("shop");
  const pool=w.gachaPool();
  ok(pool.length>0,"排出対象がある ("+pool.length+"件)");
  ok(pool.every(function(s){return s.price;}),"価格の無い予約枠は排出対象に入っていない");
  const target=pool[0];
  ok(!w.skinOwned(target),"引く前は「"+target.name+"」は未所持");

  const gem0=w.wallet().gem;
  d.querySelector('.gc-draw[data-draw="1"]').click();
  ok(w.wallet().gem===gem0-200,"1回引くと宝玉が200減る ("+gem0+" -> "+w.wallet().gem+")");
  ok(w.wallet().pity===1,"天井Pが1増える");
  ok(d.getElementById("gcModal").classList.contains("on"),"入手演出が出る");
  ok(d.querySelectorAll("#gcCards .gc-card").length===1,"1回引きはカード1枚");
  d.getElementById("bGachaClose").click();
  ok(!d.getElementById("gcModal").classList.contains("on"),"OKで閉じる");

  const gem1=w.wallet().gem;
  d.querySelector('.gc-draw[data-draw="10"]').click();
  ok(w.wallet().gem===gem1-2000,"10連で宝玉が2000減る");
  ok(d.querySelectorAll("#gcCards .gc-card").length===10,"10連はカード10枚");
  ok(w.gachaUnowned().length===0||w.gachaPool().some(function(s){return w.skinOwned(s);}),
     "10連で未所持がひとつ以上入手できた");
  d.getElementById("bGachaClose").click();

  /* 入手したものが装飾品設定で選べて、対局画面に効くこと */
  const got=w.gachaPool().filter(function(s){return w.skinOwned(s);});
  ok(got.length>0,"入手済みの装飾品がある ("+got.map(function(s){return s.name;}).join("・")+")");
  w.go("cosmetics");
  /* cosSlot / ownMemory はトップレベルの let なので window のプロパティではない。
     代入は eval を通す。w.cosSlot=... だと別物を作るだけで効かない。 */
  w.eval("cosSlot="+JSON.stringify(got[0].slot)+";cosRender()");
  const lockedNow=[].slice.call(d.querySelectorAll("#cosGrid .cos-item.locked")).length;
  const itemsNow=d.querySelectorAll("#cosGrid .cos-item").length;
  ok(lockedNow<itemsNow,"入手済みは装飾品設定で鍵が外れている ("+lockedNow+"/"+itemsNow+" が未所持)");
  w.skinSelect(got[0].slot,got[0].id);
  ok(w.skinChosen(got[0].slot)===got[0].id,
     "入手した「"+got[0].name+"」を装備できた");
  ok(root.getAttribute("data-skin-"+got[0].slot)===got[0].id,
     "装備が html の data-skin-"+got[0].slot+" に反映された");

  /* 天井交換 */
  /* 排出対象は今4件しかなく、10連で全部そろってしまうことがある。
     交換の検査は所持状態をまっさらに戻してから行う。 */
  w.eval("ownMemory=[]");
  ok(w.gachaUnowned().length===w.gachaPool().length,"所持状態を戻せた");
  w.go("shop");
  w.wallet().pity=200;w.shopPaint();
  ok(!d.getElementById("bExchange").disabled,"200pt たまると交換ボタンが押せる");
  const un0=w.gachaUnowned().length;
  d.getElementById("bExchange").click();
  ok(w.wallet().pity===0,"天井交換で200pt消費 (pity="+w.wallet().pity+")");
  ok(w.gachaUnowned().length===un0-1,"天井交換で未所持が1つ減った");
  d.getElementById("bGachaClose").click();

  document.getElementById("out").textContent=
    log.join("\n")+"\n\n"+log.filter(function(l){return l[0]==="F";}).length+" FAIL / "+log.length+" total";
},700);};
</script>
