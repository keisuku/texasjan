<!doctype html><meta charset="utf-8">
<title>390px実機幅の検査 — MAHJONG HOLD'EM</title>
<style>html,body{margin:0}iframe{width:390px;height:844px;border:0}
pre{position:fixed;left:400px;top:0;background:#fff;font:12px/1.6 monospace;padding:6px;margin:0;white-space:pre-wrap}</style>
<body><pre id="out">running</pre>
<script>
const log=[];function ok(c,m){log.push((c?"PASS  ":"FAIL  ")+m);}
const f=document.createElement("iframe");f.src="../index.html?still=1&screen=title";document.body.appendChild(f);
f.onload=function(){setTimeout(function(){
  const d=f.contentDocument,w=f.contentWindow;
  const target={title:".shell-start",lobby:".pm-match-card",match:"#bGoldenRankStart",game:"#bNext",result:".rs-actions"};
  ["title","lobby","match","game","result"].forEach(function(name){
    w.go(name);
    const app=d.getElementById("app"),a=app.getBoundingClientRect(),t=d.querySelector(target[name]).getBoundingClientRect();
    ok(app.scrollWidth<=app.clientWidth&&app.scrollHeight<=app.clientHeight,
      name+": 390px幅で画面外へのはみ出しが無い");
    ok(t.width>=40&&t.height>=40&&t.left>=a.left-1&&t.right<=a.right+1&&t.top>=a.top-1&&t.bottom<=a.bottom+1,
      name+": 見えている主要操作が40px以上で画面内に収まる");
  });
  w.go("game");
  const raise=d.getElementById("bRaise");
  if(!raise.disabled)raise.click();
  const sheet=d.getElementById("raiseSheet"),a=d.getElementById("app").getBoundingClientRect(),s=sheet.getBoundingClientRect();
  ok(sheet.classList.contains("open"),"RAISEで金額調整バーが開く");
  ok(s.left>=a.left-1&&s.right<=a.right+1&&s.top>=a.top-1&&s.bottom<=a.bottom+1,
    "金額調整バーが390px画面内に収まる");
  document.getElementById("out").textContent=log.join("\n")+"\n\n"+
    log.filter(function(x){return x.indexOf("FAIL")===0;}).length+" FAIL / "+log.length+" total";
  document.title="DONE";
},700);};
</script>
