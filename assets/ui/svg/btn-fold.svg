<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 166">
  <defs>
    <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/><stop offset=".42" stop-color="#B87342"/>
      <stop offset="1" stop-color="#3B1607"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFEA"/><stop offset=".10" stop-color="#7C451B"/>
      <stop offset=".20" stop-color="#EFC18B"/><stop offset=".32" stop-color="#5E2B09"/>
      <stop offset=".45" stop-color="#C88C4F"/><stop offset=".58" stop-color="#472005"/>
      <stop offset=".72" stop-color="#A06B3A"/><stop offset=".86" stop-color="#623011"/>
      <stop offset="1" stop-color="#251004"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="0" y2="1">
