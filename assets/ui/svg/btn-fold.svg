      <stop stop-color="#F7D1A1"/><stop offset=".34" stop-color="#B88050"/><stop offset="1" stop-color="#351405"/>
    </linearGradient>
    <linearGradient id="innerLine" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFF4C8"/><stop offset=".38" stop-color="#D19A64"/><stop offset="1" stop-color="#5A260A"/>
    </linearGradient>
    <linearGradient id="foldFace" x1="0" y1="0" x2=".82" y2="1">
