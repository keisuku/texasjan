      <stop offset=".72" stop-color="#841507"/><stop offset="1" stop-color="#580C01"/>
    </linearGradient>
    <linearGradient id="foldGloss" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFF3D2" stop-opacity=".42"/><stop offset=".32" stop-color="#F8A681" stop-opacity=".12"/>
      <stop offset="1" stop-color="#5B0B00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pressed" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#160300" stop-opacity=".62"/><stop offset=".35" stop-color="#160300" stop-opacity="0"/>
      <stop offset=".78" stop-color="#FFE0B0" stop-opacity="0"/><stop offset="1" stop-color="#FFE0B0" stop-opacity=".35"/>
