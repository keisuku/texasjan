    <linearGradient id="bevel" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFF0D3"/><stop offset=".34" stop-color="#C29872"/><stop offset="1" stop-color="#382012"/></linearGradient>
    <linearGradient id="innerLine" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFF8E9"/><stop offset=".38" stop-color="#E3B994"/><stop offset="1" stop-color="#674027"/></linearGradient>
    <linearGradient id="callFace" x1="0" y1="0" x2=".82" y2="1"><stop stop-color="#2BA1F2"/><stop offset=".2" stop-color="#0D7CE0"/><stop offset=".72" stop-color="#07499C"/><stop offset="1" stop-color="#012B6A"/></linearGradient>
    <linearGradient id="callGloss" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#DFFFFF" stop-opacity=".92"/><stop offset=".13" stop-color="#64CFFF" stop-opacity=".68"/><stop offset=".48" stop-color="#64CFFF" stop-opacity=".08"/><stop offset="1" stop-color="#64CFFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="pressed" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#001126" stop-opacity=".7"/><stop offset=".35" stop-color="#001126" stop-opacity="0"/><stop offset=".78" stop-color="#D4F5FF" stop-opacity="0"/><stop offset="1" stop-color="#D4F5FF" stop-opacity=".32"/></linearGradient>
