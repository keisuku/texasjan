<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 166">
  <defs>
    <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8D6"/><stop offset=".42" stop-color="#C78852"/><stop offset="1" stop-color="#44200B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFEA"/><stop offset=".10" stop-color="#7C451B"/>
      <stop offset=".20" stop-color="#EFC18B"/><stop offset=".32" stop-color="#5E2B09"/>
      <stop offset=".45" stop-color="#C88C4F"/><stop offset=".58" stop-color="#472005"/>
