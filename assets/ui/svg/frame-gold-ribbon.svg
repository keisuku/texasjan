    <linearGradient id="rise" x1="0" y1="0" x2=".78" y2="1"><stop stop-color="#F2CB8D"/><stop offset=".4" stop-color="#8D6034"/><stop offset="1" stop-color="#271106"/></linearGradient>
    <linearGradient id="innerLine" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFF0AF"/><stop offset=".42" stop-color="#C09258"/><stop offset="1" stop-color="#4F2B11"/></linearGradient>
    <linearGradient id="ribbonFace" x1="0" y1="0" x2=".74" y2="1"><stop stop-color="#19483D"/><stop offset=".3" stop-color="#0C2C24"/><stop offset="1" stop-color="#03110D"/></linearGradient>
