    <linearGradient id="rise" x1="0" y1="0" x2=".75" y2="1"><stop stop-color="#F0C38E"/><stop offset=".36" stop-color="#916039"/><stop offset="1" stop-color="#321405"/></linearGradient>
    <linearGradient id="innerLine" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFF4CA"/><stop offset=".44" stop-color="#D3A06C"/><stop offset="1" stop-color="#73421B"/></linearGradient>
