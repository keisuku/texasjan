<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 135">
  <defs>
    <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#604425"/><stop offset=".55" stop-color="#26180D"/><stop offset="1" stop-color="#100905"/></linearGradient>
    <linearGradient id="brightBevel" x1="0" y1="0" x2=".75" y2="1"><stop stop-color="#FFFFD8"/><stop offset=".22" stop-color="#EBBB92"/><stop offset=".55" stop-color="#AC6E38"/><stop offset="1" stop-color="#4B1D03"/></linearGradient>
