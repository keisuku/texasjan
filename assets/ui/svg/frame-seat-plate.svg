<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48">
  <defs>
    <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#80623B"/><stop offset=".55" stop-color="#26180D"/><stop offset="1" stop-color="#0B0603"/></linearGradient>
    <linearGradient id="brightBevel" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#F0D69A"/><stop offset=".35" stop-color="#9B7443"/><stop offset="1" stop-color="#3B200B"/></linearGradient>
