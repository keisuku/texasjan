<script>
const stage=document.getElementById("stage");
const sprite=document.getElementById("tileSprite");
let offsetX=0,offsetY=0,startX=0,startY=0,baseX=0,baseY=0,dragging=false,moved=false,lastTap=0;
function paint(){sprite.style.transform=`translate3d(${offsetX}px,${offsetY}px,0)`;}
function resetTile(){
  sprite.classList.add("returning");offsetX=0;offsetY=0;paint();
  window.setTimeout(()=>sprite.classList.remove("returning"),340);
}
function toggleSelected(){
  const selected=sprite.classList.toggle("selected");
  sprite.setAttribute("aria-pressed",String(selected));
  if(navigator.vibrate)navigator.vibrate(selected?24:12);
}
sprite.addEventListener("pointerdown",event=>{
  event.preventDefault();dragging=true;moved=false;startX=event.clientX;startY=event.clientY;baseX=offsetX;baseY=offsetY;
  sprite.setPointerCapture(event.pointerId);
});
sprite.addEventListener("pointermove",event=>{
  if(!dragging)return;
  const dx=event.clientX-startX,dy=event.clientY-startY;
  if(Math.hypot(dx,dy)>4)moved=true;
  const bounds=stage.getBoundingClientRect(),tile=sprite.getBoundingClientRect();
  const nextX=baseX+dx,nextY=baseY+dy;
  const originalLeft=bounds.width*.60255,originalTop=bounds.height*.33971;
  offsetX=Math.min(bounds.width-originalLeft-tile.width,Math.max(-originalLeft,nextX));
  offsetY=Math.min(bounds.height-originalTop-tile.height,Math.max(-originalTop,nextY));
  paint();
});
sprite.addEventListener("pointerup",event=>{
  if(!dragging)return;dragging=false;sprite.releasePointerCapture(event.pointerId);
  if(!moved){
    const now=performance.now();
    if(lastTap&&now-lastTap<330){resetTile();lastTap=0;}else{toggleSelected();lastTap=now;}
  }
});
sprite.addEventListener("pointercancel",()=>{dragging=false;});
sprite.addEventListener("keydown",event=>{
  if(event.key==="Enter"||event.key===" "){event.preventDefault();toggleSelected();}
  if(event.key==="Escape")resetTile();
});
</script>
